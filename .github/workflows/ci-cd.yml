name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - closed

jobs:
  # ------------------------------------------------------------------
  # Stage 1 & 2: Build & Test
  # ------------------------------------------------------------------
  build-and-test:
    # Runs on direct push to main OR when a PR is successfully merged
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build -t my-app:${{ github.sha }} .

      - name: Test Docker Container
        run: |
          echo "Running container tests..."
          docker run --rm my-app:${{ github.sha }} echo "Container test passed!"

  # ------------------------------------------------------------------
  # Stage 3: Push to Docker Hub
  # ------------------------------------------------------------------
  push-to-dockerhub:
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/my-app:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/my-app:${{ github.sha }}

  # ------------------------------------------------------------------
  # Stage 4: Deploy to Cloud
  # ------------------------------------------------------------------
  deploy:
    needs: push-to-dockerhub
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Cloud
        run: |
          echo "Deploying latest Docker image to cloud infrastructure..."

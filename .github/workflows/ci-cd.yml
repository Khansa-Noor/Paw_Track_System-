
name: Paw Track System CI/CD Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

  workflow_dispatch:

permissions:
  contents: read

jobs:

  # JOB 1: Build, Test and Push Docker Images
  build-test-push:
    name: Build, Test and Push Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Frontend Image
        run: |
          docker build -t pawtrack-frontend-test ./Frontend

      - name: Build Backend Image
        run: |
          docker build -t pawtrack-backend-test ./Backend

      # Test backend container
      - name: Test Backend Container
        run: |
          docker network create pawtrack-test-network

          docker run -d \
            --name backend-test \
            --network pawtrack-test-network \
            --network-alias backend \
            -p 8082:80 \
            pawtrack-backend-test

          for i in {1..10}; do
            if curl --fail --silent http://localhost:8082/index.js > /dev/null; then
              echo "Backend test passed!"
              break
            fi
            sleep 2
          done

          curl --fail http://localhost:8082/index.js > /dev/null

      # Test frontend and backend communication
      - name: Test Frontend Container
        run: |
          docker run -d \
            --name frontend-test \
            --network pawtrack-test-network \
            -p 8081:80 \
            pawtrack-frontend-test

          for i in {1..10}; do
            if curl --fail --silent http://localhost:8081/ > /dev/null; then
              echo "Frontend test passed!"
              break
            fi
            sleep 2
          done

          curl --fail http://localhost:8081/ > /dev/null

          curl --fail http://localhost:8081/backend/index.js > /dev/null

          echo "Frontend and backend integration test passed!"

      # Login to Docker Hub
      - name: Login to Docker Hub
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Push frontend image
      - name: Build and Push Frontend Image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: ./Frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/pawtrack-frontend:version4
            ${{ secrets.DOCKERHUB_USERNAME }}/pawtrack-frontend:${{ github.sha }}

      # Push backend image
      - name: Build and Push Backend Image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: ./Backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/pawtrack-backend:version4
            ${{ secrets.DOCKERHUB_USERNAME }}/pawtrack-backend:${{ github.sha }}

  # JOB 2: Automatically Deploy to AWS EC2
  deploy:
    name: Deploy to AWS EC2
    needs: build-test-push
    runs-on: ubuntu-latest

    # Deploy only after a successful push to main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Deploy to EC2 using SSH
        uses: appleboy/ssh-action@v1.2.2
        env:
          IMAGE_TAG: ${{ github.sha }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          envs: IMAGE_TAG,DOCKERHUB_USERNAME
          script: |
            set -e

            echo "Starting Paw Track deployment..."

            # Create Docker network if it does not exist
            docker network inspect pawtrack-network >/dev/null 2>&1 || \
              docker network create pawtrack-network

            # Pull the exact images built by this workflow
            docker pull "$DOCKERHUB_USERNAME/pawtrack-frontend:$IMAGE_TAG"
            docker pull "$DOCKERHUB_USERNAME/pawtrack-backend:$IMAGE_TAG"

            # Stop and remove previous containers
            docker rm -f \
              paw_track_frontend \
              paw_track_backend \
              pawtrack-frontend \
              pawtrack-backend 2>/dev/null || true

            # Start the new backend
            docker run -d \
              --restart unless-stopped \
              --name pawtrack-backend \
              --network pawtrack-network \
              --network-alias backend \
              "$DOCKERHUB_USERNAME/pawtrack-backend:$IMAGE_TAG"

            # Start the new frontend
            docker run -d \
              --restart unless-stopped \
              --name pawtrack-frontend \
              --network pawtrack-network \
              -p 80:80 \
              "$DOCKERHUB_USERNAME/pawtrack-frontend:$IMAGE_TAG"

            # Verify deployment
            docker ps

            echo "Paw Track deployment completed successfully!"

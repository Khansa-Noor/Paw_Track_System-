
name: Paw Track System CI/CD Pipeline

# Multiple trigger events
on:
  # Trigger 1: Push to main
  push:
    branches:
      - main

  # Trigger 2: Pull request checks
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

  # Trigger 3: Manual execution
  workflow_dispatch:

# Repository permissions
permissions:
  contents: read

jobs:
  build-test-push:
    name: Build, Test and Push Docker Images
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout source code
      - name: Checkout Repository
        uses: actions/checkout@v7

      # Step 2: Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Step 3: Build Frontend Image
      - name: Build Frontend Image
        run: |
          docker build -t pawtrack-frontend-test ./Frontend

      # Step 4: Build Backend Image
      - name: Build Backend Image
        run: |
          docker build -t pawtrack-backend-test ./Backend

      # Step 5: Test Frontend Container
      - name: Test Frontend Container
        run: |
          docker run -d --name frontend-test -p 8081:80 pawtrack-frontend-test

          for i in {1..10}; do
            if curl --fail --silent http://localhost:8081/ > /dev/null; then
              echo "Frontend test passed!"
              break
            fi
            sleep 2
          done

          curl --fail http://localhost:8081/ > /dev/null

      # Step 6: Test Backend Container
      - name: Test Backend Container
        run: |
          docker run -d --name backend-test -p 8082:80 pawtrack-backend-test

          for i in {1..10}; do
            if curl --fail --silent http://localhost:8082/index.js > /dev/null; then
              echo "Backend test passed!"
              break
            fi
            sleep 2
          done

          curl --fail http://localhost:8082/index.js > /dev/null

      # Step 7: Login to Docker Hub
      - name: Login to Docker Hub
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Step 8: Push Frontend Image
      - name: Build and Push Frontend Image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: ./Frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/pawtrack-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/pawtrack-frontend:${{ github.sha }}

      # Step 9: Push Backend Image
      - name: Build and Push Backend Image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: ./Backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/pawtrack-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/pawtrack-backend:${{ github.sha }}
